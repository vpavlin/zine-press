# Build Zine Press's darwin-arm64 (Apple Silicon) packages on a GitHub macOS runner and attach them to a
# release, so they can be merged into the Linux packages (one .lgx per module, every platform inside).
#
# Runs on a push of a tag `darwin-*` (git tag darwin-0.4.2 && git push origin darwin-0.4.2), or by hand.
# The release `<tag>` gets zine_press_core-darwin-arm64.lgx, zine-press-darwin-arm64.lgx and the build logs.
# Basecamp ships no Intel-Mac build, so there is no darwin-amd64.
name: darwin packages

on:
  push:
    tags: ["darwin-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # macos-14 was retired (2026-11)
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e   # main, 2026-10-30
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            accept-flake-config = true
      - name: Build
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p out logs
          ok=1
          for m in zine_press_core:zine_press_core zine_press:module; do
            name=${m%%:*}; dir=${m#*:}
            if (cd "$dir" && nix build --accept-flake-config .#lgx-portable -o "$GITHUB_WORKSPACE/res-$name") > "logs/$name.log" 2>&1; then
              cp -L res-$name/*.lgx "out/$name-darwin-arm64.lgx"; echo "$name OK"
            else
              echo "$name FAILED"; tail -80 "logs/$name.log"; ok=0
              # the full builder log of each failed derivation (the error shows only its last lines)
              for drv in $(grep -oE "/nix/store/[a-z0-9]+-[^ ']+\.drv" "logs/$name.log" | sort -u); do
                echo "=== nix log $drv" >> "logs/$name.log"; nix log "$drv" >> "logs/$name.log" 2>&1 || true
              done
            fi
          done
          [ $ok = 1 ]
      - name: Show variants
        shell: bash
        run: for f in out/*.lgx; do echo "$f"; tar -tzf "$f" | grep '^variants/[^/]*/$' || true; done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        # always: a failed build's logs land on the release too (readable without a GitHub login)
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            out/*.lgx
            logs/*.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: zine-press-darwin-arm64
          path: |
            out/
            logs/
